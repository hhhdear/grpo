# Ablation arm: Dynamic Sampling only. Whole groups whose rewards have zero variance are
# dropped before the loss, since they carry no advantage signal. Measured with
# frac_zero_var_filtered.
experiment: ablation_dynamic_sampling
model_config: configs/model.yaml
seed: 20261013
data:
  output_dir: data/generated
  train_path: data/generated/train.jsonl
  validation_path: data/generated/validation.jsonl
  test_path: data/generated/test.jsonl
  train_size: 3000
  validation_size: 24
  test_size: 1000
rollout:
  max_turns: 6
  max_tool_calls: 5
training:
  output_dir: checkpoints/ablation_dynamic_sampling
  learning_rate: 0.000005
  max_steps: 500
  # Batch geometry: 2 x 8 = 16 sequences per step (was 1 x 4 = 4), so the fixed per-step
  # Python overhead is amortized over four times as much work. generation_batch_size =
  # 2 x 4 = 8 stays divisible by num_generations=8, which TRL requires.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  # A wider group is also part of the fix for all-identical samples: zero variance inside
  # a group means zero advantage, and 4 samples hit that state more often than 8.
  num_generations: 8
  max_prompt_length: 768
  max_completion_length: 384
  save_steps: 100
  logging_steps: 5
  temperature: 1.0
  vllm_gpu_memory_utilization: 0.15
  beta: 0.0
dapo:
  loss_type: grpo
  epsilon_high: null
  mask_truncated_completions: false
  overlong_reward_shaping:
    enabled: false
dynamic_sampling:
  filter_zero_variance_groups: true
  zero_variance_eps: 1.0e-6
reward:
  task_success: 2.0
  rule_compliance: 0.5
  verification: 0.5
  # -0.2 rather than -1.0: a heavy penalty makes "do nothing" outscore "try and fail",
  # which is how the first run collapsed into a no-op policy. Watch invalid_action_rate.
  invalid_action: -0.2
  redundant_calls: -0.2
  execution_cost: -0.05
  # Breaks the dead zone where every sample in a group fails a multi-step task: identical
  # failures mean zero variance and therefore zero gradient, so the longer path can never
  # be discovered. Credit the intermediate steps that were actually completed.
  progress_credit: 0.5
  # Format credit is a tie-breaker only (0.2 max), never a stand-in for the grounded terms.
  format:
    structure: 0.1
    known_tool: 0.05
    valid_arguments: 0.05
    fence_penalty: 0.1
paths:
  trace_dir: logs/traces
  evaluation_dir: logs/evaluation
